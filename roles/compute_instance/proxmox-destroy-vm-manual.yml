---
- name: Remove VM
  hosts: proxmox
  # hosts: localhost
  gather_facts: false
  run_once: true

  vars_files:
    - my_vault.yml

  vars_prompt:
    - name: compute_instance_hostname
      prompt: "hostname (FQDN) "
      default: test.dns-net.de
      private: false
    - name: compute_instance_dns_provider
      prompt: 'Which DNS provider to use (inwx, hetzner)'
      private: false
      default: "manual"

  tasks:
    - name: Proxmox - stop VM
      community.proxmox.proxmox_kvm:
        api_user: "{{ proxmox_api_user }}"
        api_password: "{{ proxmox_api_pass }}"
        api_host: "{{ proxmox_api_host }}"
        api_port: "{{ proxmox_api_port | default(omit) }}"
        validate_certs: "{{ proxmox_api_validate_certs | default(omit) }}"
        name: "{{ compute_instance_hostname }}"
        timeout: 60
        force: true
        state: stopped
        # dont fail if vm does not exist:
      ignore_errors: true

    - name: Proxmox - destroy VM
      community.proxmox.proxmox_kvm:
        api_user: "{{ proxmox_api_user }}"
        api_password: "{{ proxmox_api_pass }}"
        api_host: "{{ proxmox_api_host }}"
        api_port: "{{ proxmox_api_port | default(omit) }}"
        validate_certs: "{{ proxmox_api_validate_certs | default(omit) }}"
        name: "{{ compute_instance_hostname }}"
        timeout: 30
        state: absent

    - name: Netbox - delete interface record of VM
      netbox.netbox.netbox_vm_interface:
        netbox_url: "{{ netbox_url }}"
        netbox_token: "{{ netbox_token }}"
        data:
          name: "{{ compute_instance_hostname }}-eth0"
          virtual_machine: "{{ compute_instance_hostname }}"
        state: absent
      ignore_errors: true
      tags: netbox_vm_destroy

    - name: Netbox - delete virtual machine record of VM
      netbox.netbox.netbox_virtual_machine:
        netbox_url: "{{ netbox_url }}"
        netbox_token: "{{ netbox_token }}"
        data:
          name: "{{ compute_instance_hostname }}"
        state: absent
      ignore_errors: true
      tags: netbox_vm_destroy

    # - name: Remove cloud-init image (proxmox)
      # /var/lib/vz/images/123/vm-123-cloudinit.qcow2

    - name: Determine count of subdomains for compute_instance_hostname
      ansible.builtin.set_fact:
        my_levels: "{{ compute_instance_hostname.split('.') | length | int }}"

    - name: Sets fact dns zone of compute_instance_hostname
      ansible.builtin.set_fact:
        # split has optional parameter "maxsplit" which i use to substract the last two fields - domain and tld - from it. dont worry, my simple brain hurts too ;-)
        my_dns_zone: "{{ compute_instance_hostname.split('.', lookup('ansible.builtin.vars', 'my_levels') | int - 2) | last }}"

    - name: Inwx DNS - remove main entry (A-Record)
      inwx.collection.dns:
        domain: "{{ my_dns_zone }}"
        type: A
        record: "{{ compute_instance_hostname.split('.') | first }}"
        value: "{{ proxmox_network_prefix_v4_full }}"
        username: "{{ compute_instance_dns_inwx_username }}"
        password: "{{ compute_instance_dns_inwx_password }}"
        state: absent
      tags: dns
      when:
        - compute_instance_dns_provider == "hetzner"
        - proxmox_vm_ip4 is defined and proxmox_vm_ip4 != "no"

    - name: Inwx DNS - remove main entry (AAAA-Record)
      inwx.collection.dns:
        domain: "{{ my_dns_zone }}"
        type: AAAA
        record: "{{ compute_instance_hostname.split('.') | first }}"
        value: "{{ proxmox_network_prefix_v6 }}::{{ proxmox_vm_ip6 }}"
        solo: true
        ttl: "600"
        username: "{{ compute_instance_dns_inwx_username }}"
        password: "{{ compute_instance_dns_inwx_password }}"
        state: absent
      tags: dns
      when:
        - compute_instance_dns_provider == "hetzner"
        - proxmox_vm_ip6 is defined and proxmox_vm_ip6 != "no"

    - name: DNS (Hetzner) - set A-Record
      community.dns.hetzner_dns_record_set:
        state: absent
        zone: "{{ my_dns_zone }}"
        prefix: "{{ compute_instance_hostname | replace('.' + my_dns_zone, '') }}"
        type: A
        ttl: "{{ compute_instance_dns_ttl }}"
        value: "{{ proxmox_network_ip_v4_prefixed | ansible.utils.ipaddr('address') }}"
        on_existing: replace
        hetzner_token: "{{ compute_instance_hetzner_dns_api_token }}"
      when:
      - compute_instance_dns_provider == "hetzner"
      - compute_instance_ip_v4 is defined and compute_instance_ip_v4 != "no"

    - name: DNS (Hetzner) - set AAAA-Record
      community.dns.hetzner_dns_record_set:
        state: absent
        zone: "{{ my_dns_zone }}"
        prefix: "{{ compute_instance_hostname | replace('.' + my_dns_zone, '') }}"
        type: AAAA
        ttl: "{{ compute_instance_dns_ttl }}"
        value: "{{ proxmox_network_ip_v6_prefixed | ansible.utils.ipaddr('address') }}"
        on_existing: replace
        hetzner_token: "{{ compute_instance_hetzner_dns_api_token }}"
      when:
        - compute_instance_dns_provider == "hetzner"
        - compute_instance_ip_v6 is defined and compute_instance_ip_v6 != "no"
