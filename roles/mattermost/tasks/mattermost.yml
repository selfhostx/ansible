---
- name: Create group mattermost
  ansible.builtin.group:
    name: "{{ mattermost_group }}"
    state: present
    system: true

- name: Create user mattermost and add user mattermost to group
  ansible.builtin.user:
    name: "{{ mattermost_user }}"
    group: "{{ mattermost_group }}"
    system: true
    state: present

- name: Check if version is already installed
  ansible.builtin.stat:
    path: "{{ mattermost_target_path }}/bin/mattermost"
  register: mattermost_binary

- name: Set fact if version already installed
  ansible.builtin.set_fact:
    mattermost_already_installed: "{{ mattermost_binary.stat.exists }}"
    mattermost_target_present: "{{ mattermost_binary.stat.exists or not ansible_check_mode }}"

- name: Download, verify and extract mattermost
  when:
    - not mattermost_skip_download
    - not mattermost_already_installed
    - not ansible_check_mode
  block:
    - name: Create download directory
      ansible.builtin.file:
        mode: '0775'
        path: "{{ mattermost_download_path }}"
        state: directory

    - name: Download mattermost archive
      ansible.builtin.get_url:
        url: "{{ mattermost_download_url }}"
        dest: "{{ mattermost_download_path }}.tar.gz"
        checksum: "{{ mattermost_download_checksum if mattermost_download_checksum | length > 0 else omit }}"
        mode: '0640'

    - name: Extract mattermost archive
      ansible.builtin.unarchive:
        remote_src: true
        src: "{{ mattermost_download_path }}.tar.gz"
        dest: "{{ mattermost_download_path }}"
        mode: 'u=rwX,g=rwX,o='
        owner: "{{ mattermost_user }}"
        group: "{{ mattermost_group }}"

    - name: Remove mattermost archive
      ansible.builtin.file:
        path: "{{ mattermost_download_path }}.tar.gz"
        state: absent

    - name: Cleanup downloaded folder (directories linked to datadir)
      ansible.builtin.file:
        path: "{{ mattermost_target_path }}/{{ item }}"
        state: absent
      loop: "{{ mattermost_linked_data_folders }}"
  rescue:
    - name: Remove incomplete download
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ mattermost_download_path }}"
        - "{{ mattermost_download_path }}.tar.gz"

    - name: Abort after failed download
      ansible.builtin.fail:
        msg: "Download or checksum of {{ mattermost_download_url }} failed: {{ ansible_failed_result.msg | default('') }}"

- name: Create mattermost data directory
  ansible.builtin.file:
    mode: '0770'
    path: '{{ mattermost_datadir_path }}'
    state: directory

# - name: Check if folder from mattermost_linked_folder is a link
#  ansible.builtin.stat:
#    path: '{{ mattermost_app_path }}/{{ item }}'
#  register: mattermost_folder_link_{{ item }}

# - name: Rename folder when not a link (most likely default folder from package)
#  command:
#    path: 'mv {{ mattermost_app_path }}/{{ item }} {{ mattermost_app_path }}/{{ item }}-old'
#  when:
#  - mattermost_folder_link_{{ item }}.stat.islnk
#  - mattermost_folder_link_{{ item }}.stat.islnk == False
#  loop: "{{ mattermost_linked_data_folders }}"

- name: Create folders in data dir (if they do not exist)
  ansible.builtin.file:
    path: '{{ mattermost_datadir_path }}/{{ item }}'
    state: directory
    mode: 'u=rwx,g=rwx,o='
  loop: "{{ mattermost_linked_data_folders }}"

- name: Link folders to datadir
  ansible.builtin.file:
    src: '{{ mattermost_datadir_path }}/{{ item }}'
    dest: '{{ mattermost_target_path }}/{{ item }}'
    state: link
  loop: "{{ mattermost_linked_data_folders }}"
  when: mattermost_target_present

# no diff: contains database and SMTP passwords
- name: Template mattermost config config.json
  ansible.builtin.template:
    backup: true
    dest: '{{ mattermost_datadir_path }}/config/config.json'
    mode: '0660'
    src: '{{ mattermost_config_json_template }}'
  diff: false
  when: mattermost_managed_config | bool
  notify: Restart mattermost

- name: Dump database before version change
  ansible.builtin.include_tasks: backup.yml
  when:
    - mattermost_backup_before_update | bool
    - mattermost_switch_pending
    - mattermost_target_present
    - not ansible_check_mode

- name: Switch version and verify
  block:
    - name: Link mattermost binary to current version
      ansible.builtin.file:
        src: "{{ mattermost_target_path }}"
        dest: "{{ mattermost_app_path }}"
        state: link
      register: mattermost_link_result
      notify: Restart mattermost
      when: mattermost_target_present

    - name: Ensure correct permissions on app path
      ansible.builtin.file:
        path: '{{ mattermost_app_path }}'
        state: directory
        owner: "{{ mattermost_user }}"
        group: "{{ mattermost_group }}"
        mode: 'g+w'
        recurse: true

    - name: Ensure correct permissions on data directory
      ansible.builtin.file:
        path: '{{ mattermost_datadir_path }}'
        state: directory
        owner: "{{ mattermost_user }}"
        group: "{{ mattermost_group }}"
        mode: 'u=rwX,g=rwX,o='
        recurse: true

    - name: Ensure correct permissions on mattermost binary
      ansible.builtin.file:
        path: '{{ mattermost_app_binary }}'
        state: 'file'
        owner: "{{ mattermost_user }}"
        group: "{{ mattermost_group }}"
        mode: 'u=rwx,g=rwx,o='
      when: mattermost_target_present

    - name: Ensure sufficient capabilities on mattermost binary
      community.general.capabilities:
        path: '{{ mattermost_app_binary }}'
        capability: cap_net_bind_service=+ep
        state: present
      when: mattermost_target_present

    - name: Create directory for environment file
      ansible.builtin.file:
        path: "{{ mattermost_env_file | dirname }}"
        state: directory
        owner: root
        group: root
        mode: '0750'
      when: mattermost_env | length > 0

    # no diff: contains secrets
    - name: Template environment file
      ansible.builtin.template:
        src: etc/mattermost/mattermost.env.j2
        dest: "{{ mattermost_env_file }}"
        owner: root
        group: root
        mode: '0600'
      diff: false
      notify: Restart mattermost
      when: mattermost_env | length > 0

    - name: Remove environment file when unused
      ansible.builtin.file:
        path: "{{ mattermost_env_file }}"
        state: absent
      notify: Restart mattermost
      when: mattermost_env | length == 0

    - name: Ensure mattermost unit file exists
      ansible.builtin.template:
        backup: true
        dest: '/etc/systemd/system/{{ mattermost_unit_name }}'
        mode: '0644'
        src: 'templates/etc/systemd/system/mattermost.service.j2'
      register: mattermost_unitfile_changed
      notify: Restart mattermost

    - name: Reload unitfile with systemctl daemon-reload
      # make sure daemon_reload happens before other handlers like restart
      ansible.builtin.systemd:
        daemon_reload: true
      when:
        - mattermost_unitfile_changed is defined
        - mattermost_target_present

    - name: Enable unitfile
      ansible.builtin.systemd:
        name: "{{ mattermost_unit_name }}"
        enabled: true
      when: mattermost_target_present

    - name: Force handlers
      ansible.builtin.meta: flush_handlers

    - name: Ensure mattermost service is started
      ansible.builtin.service:
        name: 'mattermost'
        enabled: true
        state: started
      when: mattermost_target_present

    - name: Verify running version and edition
      ansible.builtin.include_tasks: verify.yml
      when:
        - mattermost_verify_after_start | bool
        - not ansible_check_mode
  rescue:
    - name: Stop failed version
      ansible.builtin.systemd:
        name: "{{ mattermost_unit_name }}"
        state: stopped
      failed_when: false
      when:
        - mattermost_link_result | default({}) is changed
        - mattermost_previous_path | length > 0

    - name: Point link back to previous version
      ansible.builtin.file:
        src: "{{ mattermost_previous_path }}"
        dest: "{{ mattermost_app_path }}"
        state: link
      when:
        - mattermost_link_result | default({}) is changed
        - mattermost_previous_path | length > 0

    - name: Start mattermost after failed switch
      ansible.builtin.systemd:
        name: "{{ mattermost_unit_name }}"
        state: started
      failed_when: false

    - name: Abort after failed switch
      ansible.builtin.fail:
        msg: >-
          Switch to {{ mattermost_version }} {{ mattermost_edition }} failed at
          "{{ ansible_failed_task.name | default('unknown') }}": {{ ansible_failed_result.msg | default('') }}
          {% if mattermost_link_result | default({}) is changed and mattermost_previous_path | length > 0 %}
          Link is back on {{ mattermost_previous_path }}. Migrations may already have run, the old version may
          not start; the way back is then the dump {{ mattermost_backup_file | default('(none taken)') }}.
          {% endif %}
