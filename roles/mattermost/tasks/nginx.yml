---
- name: Read nginx version
  ansible.builtin.command: nginx -v
  register: mattermost_nginx_version_raw
  changed_when: false
  failed_when: false
  check_mode: false

- name: Choose http2 syntax by nginx version
  ansible.builtin.set_fact:
    mattermost_nginx_http2_on: "{{ (mattermost_nginx_version_raw.stderr | default('') | regex_search('[0-9]+\\.[0-9]+\\.[0-9]+') | default('0.0.0', true)) is version('1.25.1', '>=') }}"

- name: Ensure /etc/nginx/sites-enabled/default is absent
  ansible.builtin.file:
    path: '/etc/nginx/sites-enabled/default'
    state: 'absent'
  notify: Restart nginx

- name: Ensure /etc/nginx/sites-available/mattermost is present
  ansible.builtin.template:
    dest: '/etc/nginx/sites-available/mattermost'
    mode: '0644'
    src: '{{ mattermost_nginx_template }}'
  notify: Restart nginx

- name: Enable nginx config via symbolic link
  ansible.builtin.file:
    src: '/etc/nginx/sites-available/mattermost'
    dest: '/etc/nginx/sites-enabled/mattermost'
    state: 'link'
  notify: Restart nginx
