---
- name: Restart postfix
  ansible.builtin.service:
    name: postfix
    state: restarted

- name: Restart saslauthd
  ansible.builtin.service:
    name: "{{ postfix_saslauthd_daemon_name }}"
    state: restarted

- name: Postmap postfix_smtp_sasl_password_maps
  ansible.builtin.command: postmap "{{ postfix_smtp_sasl_password_maps }}"
  changed_when: true

- name: Postmap postfix_relaydomains_file
  ansible.builtin.command: postmap "{{ postfix_relaydomains_file }}"
  changed_when: true

- name: Postmap sender_canonical
  ansible.builtin.command: postmap "{{ postfix_sender_canonical_maps_file }}"
  changed_when: true
