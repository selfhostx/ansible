# vars specific for Debian systems
#
# The three nginx path variables used to live here. They are exactly what the role's
# own note above `include_vars` in tasks/main.yml warns about: "dont put vars here
# which the user overrides since include_vars has a high precedence". Role vars beat
# play vars AND host vars, so setting them in a playbook had no effect and no error —
# the playbook read as if it configured conf.d while the role kept using
# sites-available. They now live in defaults/main.yml, where an override works.
