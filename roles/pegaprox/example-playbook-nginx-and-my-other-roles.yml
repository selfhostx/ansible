---
pegaprox_hostname: "pegaprox.domain.tld"
pegaprox_nginx_deploy_reverseconfig: true
pegaprox_nginx_remove_default_config: true
pegaprox_nginx_use_nginx_common_snippet: true
pegaprox_port: 5000
pegaprox_bind: "127.0.0.1"

pegaprox_env:
  # --- Network / server ---
  PEGAPROX_PORT: "{{ pegaprox_port }}"   # web UI + API; VNC: 5001 (port+1), SSH: 5002 (port+2)
  PEGAPROX_HOST: "{{ pegaprox_bind }}"   # bind address
  PEGAPROX_HTTP_PORT: 8080                 # HTTP port for redirect to HTTPS
  PEGAPROX_URL: "{{ pegaprox_hostname }}"   # self-URL for VNC/SSH websocket callbacks
  PEGAPROX_SERVER: "auto"                # gevent | flask | auto
  PEGAPROX_NO_GEVENT: ""                 # "1" disables gevent
  PEGAPROX_WORKERS: ""                   # default: max(32, CPU*16); set only to tighten the cap

  # --- Reverse proxy -> change this if "pegaprox_nginx_deploy_reverseconfig: true" ---
  PEGAPROX_BEHIND_PROXY: "true"         # true = no built-in SSL, binds to 127.0.0.1
  PEGAPROX_TRUSTED_PROXIES: "127.0.0.0/8"  # e.g. "192.168.0.123/24" - never 0.0.0.0
  PEGAPROX_ALLOWED_ORIGINS: "{{ pegaprox_hostname }}"  # comma-separated CORS origins, i.e. "{{ pegaprox_hostname }}"

  # --- Limits ---
  PEGAPROX_API_RATE_LIMIT: 1200          # requests per window
  PEGAPROX_API_RATE_WINDOW: 60           # window in seconds
  PEGAPROX_SSH_MAX_CONCURRENT: 25        # concurrent SSH sessions
  PEGAPROX_MAX_REQUEST_SIZE: "10MB"      # max API request size
  PEGAPROX_MAX_UPLOAD_SIZE: "100GB"      # max upload (ISO); must match client_max_body_size

  # --- Logging / debug ---
  PEGAPROX_DEBUG: "false"
  PEGAPROX_LOG_LEVEL: "INFO"             # DEBUG | INFO | WARNING | ERROR
  PEGAPROX_FILE_LOG_LEVEL: "DEBUG"       # level for logs/<cluster-id>.log
  PEGAPROX_DISABLE_FILE_LOG: ""          # "1" = no per-cluster log file (SIEM/journald)

  # --- Encryption ---
  PEGAPROX_CIPHER_MEMORY_SECURITY: "auto"   # auto | on | off (SQLCipher mlock())
  PEGAPROX_DISABLE_AUTO_ENCRYPT: ""         # "1" = skip auto-encryption on first boot
