---
# tasks file for roles/vaultwarden

- name: Include OS-family specific variables
  ansible.builtin.include_vars: "vars-{{ ansible_facts['os_family'] }}.yml"
  tags:
    - always

- name: Include EPEL role for RedHat family
  ansible.builtin.include_role:
    name: "{{ vaultwarden_epel_rolename }}"
  when:
    - vaultwarden_epel_include_role | bool
    - ansible_facts['os_family'] == 'RedHat'

- name: Install required packages
  ansible.builtin.package:
    name: "{{ vaultwarden_packages_base + (vaultwarden_packages_backup if vaultwarden_backup_enable | bool else []) }}"
    state: present
  become: true

- name: Create directory structure
  ansible.builtin.file:
    owner: root
    group: root
    mode: '0750'
    path: "{{ item }}"
    state: directory
  become: true
  loop:
    - "{{ vaultwarden_project_src }}"
    - "{{ vaultwarden_project_src }}/data"

- name: Hash admin token with argon2
  ansible.builtin.command:
    argv:
      - argon2
      - "{{ vaultwarden_admin_token_salt[:32] }}"
      - -e
      - -id
      - -k
      - "65540"
      - -t
      - "3"
      - -p
      - "4"
    stdin: "{{ vaultwarden_admin_token }}"
    stdin_add_newline: false
  register: vaultwarden_admin_token_argon2
  changed_when: false
  check_mode: false
  no_log: true
  tags:
    - env
  when:
    - vaultwarden_admin_token is defined
    - vaultwarden_admin_token_argon2_prehashed is not defined

- name: Template .env file
  ansible.builtin.template:
    src: "{{ vaultwarden_docker_env_template }}"
    dest: "{{ vaultwarden_project_src }}/{{ vaultwarden_docker_env_file }}"
    owner: root
    group: root
    mode: '0640'
  become: true
  tags:
    - env

- name: Template docker-compose file
  ansible.builtin.template:
    src: "{{ vaultwarden_docker_compose_template }}"
    dest: "{{ vaultwarden_project_src }}/docker-compose.yml"
    owner: root
    group: root
    mode: '0640'
  become: true

# recreates the container on changed image, compose file or env
- name: Start vaultwarden
  community.docker.docker_compose_v2:
    project_src: "{{ vaultwarden_project_src }}"
    state: present
    pull: "{{ 'always' if vaultwarden_version == 'latest' else 'missing' }}"
    remove_orphans: true
  become: true
  tags:
    - env

- name: Configure nginx
  ansible.builtin.import_tasks: nginx.yml
  when: vaultwarden_nginx_deploy_reverseconfig | bool

- name: Configure backup
  ansible.builtin.import_tasks: backup.yml
  when:
    - vaultwarden_backup_enable | bool
    - vaultwarden_database_url | length == 0
