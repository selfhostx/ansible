---
# defaults for vaultwarden

vaultwarden_hostname: "{{ ansible_facts['fqdn'] | default(inventory_hostname) }}"

# image tag, see https://github.com/dani-garcia/vaultwarden/releases
# "latest" is pulled on every run
vaultwarden_version: "latest"

# Token for the admin interface (hashed with argon2). If not set, the admin panel is disabled.
# preferably use a long random string: openssl rand -base64 48
# vaultwarden_admin_token: "-> vault"

# salt for hashing the admin token, fixed per host to keep the hash stable
vaultwarden_admin_token_salt: "{{ (inventory_hostname ~ '-vaultwarden') | hash('sha256') }}"

# alternatively provide an argon2 PHC string directly, e.g. from `vaultwarden hash`:
# vaultwarden_admin_token_argon2_prehashed: "$argon2id$v=19$m=65540,t=3,p=4$..."

# empty = SQLite in {{ vaultwarden_project_src }}/data
# example: "mysql://vaultwarden:PASSWORD@DBHOST/vaultwarden" (URL-encode the password)
vaultwarden_database_url: ""

# additional environment, see https://github.com/dani-garcia/vaultwarden/blob/main/.env.template
# vaultwarden_env_extra: |
#   SIGNUPS_ALLOWED=false
#   SIGNUPS_DOMAINS_WHITELIST=my-domain.tld
vaultwarden_env_extra: ""

vaultwarden_project_src: "/opt/vaultwarden"
vaultwarden_docker_compose_template: "docker-compose.j2"
vaultwarden_docker_env_template: "docker-env.j2"
# filename or relative path to env-file:
vaultwarden_docker_env_file: ".env"

# prefix with a registry if needed, e.g. "registry.example.com/vaultwarden/server"
vaultwarden_image: "vaultwarden/server"
vaultwarden_container_name: "vaultwarden"
vaultwarden_listen: "127.0.0.1:8080"

vaultwarden_epel_include_role: true
vaultwarden_epel_rolename: "geerlingguy.repo-epel"

# reverse proxy (nginx must already be installed, e.g. via selfhostx.ansible.nginx_common):
vaultwarden_nginx_deploy_reverseconfig: true
vaultwarden_nginx_template: "nginx-vaultwarden.conf.j2"

# conf.d is included by nginx.conf on Debian, Ubuntu, RedHat and nginx.org packages.
# For the Debian layout use sites-available / sites-enabled (a symlink is created).
vaultwarden_nginx_config_src_dir: "/etc/nginx/conf.d"
vaultwarden_nginx_config_dst_dir: "/etc/nginx/conf.d"
# conf.d only includes *.conf:
vaultwarden_nginx_config_filename: "vaultwarden.conf"

# remove vhost left in sites-available/sites-enabled by older versions of this role:
vaultwarden_nginx_remove_legacy_config: true

vaultwarden_nginx_remove_default_config: false
vaultwarden_nginx_default_config: "{{ '/etc/nginx/sites-enabled/default' if ansible_facts['os_family'] == 'Debian' else '/etc/nginx/conf.d/default.conf' }}"

# max upload size (attachments, sends):
vaultwarden_nginx_client_max_body_size: "525M"

# if you use our nginx_common role, use "true" here:
vaultwarden_nginx_use_nginx_common_snippet: false

vaultwarden_nginx_snippet_directory: "{{ nginx_snippet_directory | default('/etc/nginx/snippets') }}"
vaultwarden_nginx_tls_hardening_snippet: "{{ vaultwarden_nginx_snippet_directory }}/tls-hardening.conf"
# enable HSTS (not used when vaultwarden_nginx_use_nginx_common_snippet: true):
vaultwarden_tls_hsts_enable: true
vaultwarden_tls_hsts_time: 31536000

# path to ssl certificates, defaults to letsencrypt paths:
vaultwarden_nginx_ssl_certificate: "/etc/letsencrypt/live/{{ vaultwarden_hostname }}/fullchain.pem"
vaultwarden_nginx_ssl_certificate_key: "/etc/letsencrypt/live/{{ vaultwarden_hostname }}/privkey.pem"

# hide nginx version number from server-header ("server: nginx" will still be present):
# remove others vhosts to prevent leaking the version number from them (i.e. with var "vaultwarden_nginx_remove_default_config")
vaultwarden_hide_nginx_version: true

# daily backup of the SQLite database and data directory (only without vaultwarden_database_url):
vaultwarden_backup_enable: false
vaultwarden_backup_dir: "/var/backups/vaultwarden"
vaultwarden_backup_retention_days: 14
vaultwarden_backup_hour: 3
vaultwarden_backup_minute: 30
