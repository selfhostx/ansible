---
# tasks file
- name: Install nginx package
  ansible.builtin.package:
    name: "nginx"
    state: present

- name: Set nginx_user and nginx_group for nginx (Debian)
  ansible.builtin.set_fact:
    nginx_user: "www-data"
    nginx_group: "www-data"
  when:
    - ansible_facts['os_family'] == "Debian"

- name: Check for ssl-cert group
  ansible.builtin.command: getent group ssl-cert
  register: nginx_common_ssl_cert_group
  changed_when: false
  failed_when: false
  check_mode: false

- name: Ensure ssl private directory exists
  ansible.builtin.file:
    path: "{{ nginx_ssl_private_directory }}"
    state: directory
    owner: "{{ nginx_ssl_private_directory_owner }}"
    group: "{{ nginx_common_private_group }}"
    mode: "{{ nginx_ssl_private_directory_mode if nginx_ssl_private_directory_mode | length > 0 else ('0710' if nginx_common_private_group != 'root' else '0700') }}"
  vars:
    nginx_common_private_group: "{{ nginx_ssl_private_directory_group if nginx_ssl_private_directory_group | length > 0 else ('ssl-cert' if nginx_common_ssl_cert_group.rc == 0 else 'root') }}"

- name: Ensure snippet directory exists
  ansible.builtin.file:
    path: "{{ nginx_snippet_directory }}"
    state: directory
    owner: "{{ nginx_user }}"
    group: "{{ nginx_group }}"
    mode: "0750"

- name: Nginx TLS hardening
  ansible.builtin.template:
    src: "{{ nginx_tls_hardening_template }}"
    dest: "{{ nginx_tls_hardening_snippet }}"
    mode: "0600"

- name: Generate DH Parameters (will take a while!)
  community.crypto.openssl_dhparam:
    path: "{{ nginx_dh_filename }}"
    size: "{{ nginx_dh_size }}"
  when: nginx_dh_enable | bool

- name: Set permissions for DH Parameters
  ansible.builtin.file:
    path: "{{ nginx_dh_filename }}"
    owner: root
    group: root
    mode: "0600"
  when: nginx_dh_enable | bool
